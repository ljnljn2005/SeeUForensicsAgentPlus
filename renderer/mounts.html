<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
<title>镜像挂载</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0B1220;
    --surface: #111C31;
    --surface-2: #16233C;
    --accent: #22D3EE;
    --accent-soft: #164E63;
    --text: #E2E8F0;
    --muted: #94A3B8;
    --danger: #F87171;
    --ok: #34D399;
    --warn: #FBBF24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 20px 24px 32px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; line-height: 1.6; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  button {
    background: var(--surface-2); color: var(--text);
    border: 1px solid #263553; border-radius: 8px;
    padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  button.primary:hover { background: var(--accent); color: #04202b; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .card {
    background: var(--surface); border: 1px solid #1E2C47; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  .label { color: var(--muted); font-size: 12px; width: 76px; flex: none; }
  .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; word-break: break-all; }
  .pill {
    display: inline-block; font-size: 11px; border-radius: 999px; padding: 1px 8px;
    border: 1px solid #263553; color: var(--muted);
  }
  .pill.ok { border-color: var(--ok); color: var(--ok); }
  .pill.bad { border-color: var(--danger); color: var(--danger); }
  .pill.warn { border-color: var(--warn); color: var(--warn); }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 8px; word-break: break-all; }
  .hint.err { color: var(--danger); }
  .hint.ok { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid #1E2C47; }
  th { color: var(--muted); font-weight: 500; }
  td.pick { width: 34px; }
  .empty { color: var(--muted); text-align: center; padding: 22px 0; font-size: 12px; }
  input[type="text"] {
    background: var(--surface-2); color: var(--text);
    border: 1px solid #263553; border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  #mountPoint { width: 96px; text-transform: uppercase; }
  .file { flex: 1; min-width: 0; }
  #toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--accent-soft); border-radius: 8px;
    color: var(--text); font-size: 12px; padding: 8px 16px; max-width: 90%;
    display: none; white-space: pre-wrap; word-break: break-all;
  }
  #toast.ok { border-color: var(--ok); }
  #toast.err { border-color: var(--danger); }
</style>
</head>
<body>
  <h1>镜像挂载</h1>
  <div class="sub">
    把取证镜像（E01 / RAW / VMDK / VHDX / QCOW2 …）通过 LovelyCarve CLI 挂成一个<strong>只读盘符</strong>，
    然后让会话里的技能直接按路径分析。挂载点只在 SeeU 运行期间有效，关闭外壳会释放；
    挂载/卸载依赖 Dokan 驱动，可能需要以管理员身份运行外壳。
  </div>

  <div class="card">
    <h2>LovelyCarve CLI</h2>
    <div class="row">
      <span class="label">状态</span>
      <span id="cliState" class="pill">检测中…</span>
      <span id="cliPath" class="mono" style="flex:1;min-width:0"></span>
      <button id="btnSettings">去设置路径…</button>
      <button id="btnRefresh">刷新</button>
    </div>
    <div id="cliHint" class="hint"></div>
    <div id="timing" class="hint"></div>
    <div id="lastMount" class="hint" data-last-mount="1"></div>
  </div>

  <div class="card">
    <h2>选择镜像</h2>
    <div class="row">
      <span class="label">镜像文件</span>
      <input type="text" class="mono file" id="imagePath" readonly placeholder="尚未选择：点右侧「选择镜像…」" />
      <button class="primary" id="btnPick">选择镜像…</button>
      <button id="btnInspect" disabled>解析分区</button>
    </div>
    <div id="inspectHint" class="hint"></div>
    <div id="partitions"></div>
    <div class="row" id="mountRow" style="display:none; margin-top:12px">
      <span class="label">挂载到</span>
      <input type="text" id="mountPoint" placeholder="X:" />
      <button class="primary" id="btnMount">挂载为只读盘</button>
    </div>
    <div id="mountHint" class="hint"></div>
  </div>

  <div class="card">
    <h2>当前挂载</h2>
    <div id="mounts"></div>
    <div class="hint">挂载清单写入 <span class="mono" id="stateFile"></span>，并通过环境变量 <span class="mono">SEEU_MOUNTS_FILE</span> 交给会话，技能可以直接读取。</div>
  </div>

  <div id="toast"></div>

<script>
(function () {
  'use strict';
  var api = window.seeu && window.seeu.mounts;
  var els = {
    cliState: document.getElementById('cliState'),
    cliPath: document.getElementById('cliPath'),
    cliHint: document.getElementById('cliHint'),
    timing: document.getElementById('timing'),
    lastMount: document.getElementById('lastMount'),
    imagePath: document.getElementById('imagePath'),
    inspectHint: document.getElementById('inspectHint'),
    partitions: document.getElementById('partitions'),
    mountRow: document.getElementById('mountRow'),
    mountPoint: document.getElementById('mountPoint'),
    mountHint: document.getElementById('mountHint'),
    mounts: document.getElementById('mounts'),
    stateFile: document.getElementById('stateFile'),
    toast: document.getElementById('toast'),
  };
  var toastTimer = null;
  var status = null;
  var inspect = null;
  var busy = false;
  var lastTiming = '';

  function fmtMs(n) {
    var v = Number(n);
    if (!isFinite(v) || v <= 0) return '';
    return v >= 1000 ? (v / 1000).toFixed(2) + ' s' : Math.round(v) + ' ms';
  }

  function noteTiming(label, ms) {
    var text = fmtMs(ms);
    if (!text) return;
    lastTiming = label + ' ' + text + (lastTiming ? ' · ' + lastTiming : '');
    els.timing.textContent = '最近操作：' + lastTiming;
  }

  function toast(msg, kind) {
    els.toast.textContent = msg;
    els.toast.className = kind || '';
    els.toast.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { els.toast.style.display = 'none'; }, 6000);
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtSize(n) {
    if (!n || !isFinite(n)) return '';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = 0;
    var v = Number(n);
    while (v >= 1024 && i < units.length - 1) { v = v / 1024; i++; }
    return v.toFixed(v >= 10 || i === 0 ? 0 : 1) + ' ' + units[i];
  }

  function setBusy(next) {
    busy = next;
    document.getElementById('btnPick').disabled = next;
    document.getElementById('btnInspect').disabled = next || !els.imagePath.value;
    document.getElementById('btnMount').disabled = next;
    document.getElementById('btnRefresh').disabled = next;
  }

  function lastMountText(last) {
    if (!last || !last.mountPoint) return '最近一次挂载：还没有记录。';
    var when = last.releasedAt || last.mountedAt || '';
    var time = when ? new Date(when).toLocaleString('zh-CN', { hour12: false }) : '';
    var part = last.partition === undefined || last.partition === null ? '' : '（分区 ' + last.partition + '）';
    var state = last.releasedAt ? '已卸载' : '运行中';
    return '最近一次挂载：' + last.mountPoint + ' ← ' + (last.imageName || last.imagePath || '') + part + ' · ' + time + ' · ' + state;
  }

  function renderStatus(view) {
    status = view;
    if (!view) return;
    var cli = view.cli || {};
    els.cliState.className = 'pill ' + (cli.path ? 'ok' : 'bad');
    els.cliState.textContent = cli.path ? ('已找到' + (cli.version ? ' · ' + cli.version : '')) : '未配置';
    els.cliPath.textContent = cli.path || '';
    if (cli.error) {
      els.cliHint.className = 'hint err';
      els.cliHint.textContent = cli.error;
    } else {
      els.cliHint.className = 'hint';
      els.cliHint.textContent = '来源：' + (cli.source || '') + (view.hostRunning ? ' · 常驻 CLI 进程运行中' : '');
    }
    els.stateFile.textContent = view.stateFile || '';
    els.lastMount.textContent = lastMountText(view.lastMount);
    if (!els.mountPoint.value) els.mountPoint.value = view.defaultMountPoint || 'X:';

    var mounts = view.mounts || [];
    if (!mounts.length) {
      els.mounts.innerHTML = '<div class="empty">还没有挂载的镜像。</div>';
      return;
    }
    els.mounts.innerHTML = mounts.map(function (m) {
      return '<div class="card" style="margin:0 0 10px">' +
        '<div class="row">' +
          '<span class="pill ' + (m.exists ? 'ok' : 'warn') + '">' + esc(m.mountPoint) + '</span>' +
          '<span class="mono" style="flex:1;min-width:0">' + esc(m.imagePath) + '</span>' +
        '</div>' +
        '<div class="hint">分区 /part:' + esc(m.partition) + ' · 挂载于 ' + esc(m.mountedAt) + (m.exists ? '' : ' · 系统里看不到该盘（可能已被手动卸载）') + '</div>' +
        '<div class="row" style="margin-top:8px">' +
          '<button data-open="' + esc(m.mountPoint) + '">打开盘符</button>' +
          '<button class="danger" data-unmount="' + esc(m.id) + '">卸载</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderInspect(result) {
    inspect = result;
    if (!result || !result.ok) {
      els.partitions.innerHTML = '';
      els.mountRow.style.display = 'none';
      els.inspectHint.className = 'hint err';
      els.inspectHint.textContent = result && result.error ? '解析失败：' + result.error : '';
      return;
    }
    var image = result.image || {};
    var parts = image.partitions || [];
    els.inspectHint.className = 'hint ok';
    els.inspectHint.textContent = '✓ ' + (image.name || '') + (image.format ? ' · ' + image.format : '') +
      (image.sizeBytes ? ' · ' + fmtSize(image.sizeBytes) : '') + ' · 共 ' + parts.length + ' 个分区';
    if (!parts.length) {
      els.partitions.innerHTML = '<div class="empty">没有解析到分区（可能整盘就是一个文件系统）。</div>';
      els.mountRow.style.display = 'flex';
      return;
    }
    els.partitions.innerHTML = '<table><thead><tr><th class="pick"></th><th>分区</th><th>卷标</th><th>文件系统</th><th>大小</th></tr></thead><tbody>' +
      parts.map(function (p, i) {
        return '<tr>' +
          '<td class="pick"><input type="radio" name="part" value="' + esc(p.index) + '"' + (i === 0 ? ' checked' : '') + ' /></td>' +
          '<td>/part:' + esc(p.index) + '</td>' +
          '<td>' + esc(p.label || '') + '</td>' +
          '<td>' + esc(p.fileSystem || '') + '</td>' +
          '<td>' + esc(fmtSize(p.sizeBytes)) + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>';
    els.mountRow.style.display = 'flex';
  }

  async function refresh() {
    if (!api) {
      toast('预加载桥不可用（window.seeu.mounts 缺失），请从桌面版菜单打开本页。', 'err');
      return;
    }
    try {
      renderStatus(await api.get());
    } catch (error) {
      toast('读取挂载状态失败：' + (error && error.message ? error.message : error), 'err');
    }
  }

  async function pick() {
    var res = await api.pickImage();
    if (!res || !res.ok || !res.path) return;
    els.imagePath.value = res.path;
    document.getElementById('btnInspect').disabled = busy || !res.path;
    els.inspectHint.textContent = '';
    els.partitions.innerHTML = '';
    els.mountRow.style.display = 'none';
    await doInspect();
  }

  async function doInspect() {
    var imagePath = els.imagePath.value.trim();
    if (!imagePath) return;
    setBusy(true);
    els.inspectHint.className = 'hint';
    els.inspectHint.textContent = '正在解析镜像分区…（首次读取元数据可能几秒）';
    try {
      var res = await api.inspect(imagePath);
      if (res && res.ms) noteTiming('解析', res.ms);
      if (res && !res.ok && res.hint) els.inspectHint.textContent = '解析失败：' + (res.error || '') + '。' + res.hint;
      renderInspect(res);
    } finally {
      setBusy(false);
    }
  }

  async function mount() {
    var imagePath = els.imagePath.value.trim();
    if (!imagePath) return;
    var picked = document.querySelector('input[name="part"]:checked');
    var partition = picked ? Number(picked.value) : 0;
    var mountPoint = els.mountPoint.value.trim().toUpperCase();
    setBusy(true);
    els.mountHint.className = 'hint';
    els.mountHint.textContent = '正在挂载，可能需要几秒并弹出系统授权提示…';
    try {
      var res = await api.mount({ imagePath: imagePath, partition: partition, mountPoint: mountPoint });
      if (!res.ok) {
        els.mountHint.className = 'hint err';
        els.mountHint.textContent = '挂载失败：' + (res.error || '未知错误') + (res.hint ? '。' + res.hint : '');
        return;
      }
      if (res.ms) noteTiming('挂载', res.ms);
      els.mountHint.className = 'hint ok';
      els.mountHint.textContent = '✓ 已挂载到 ' + res.mount.mountPoint + '（只读，' + (fmtMs(res.ms) || '已完成') + '），可在会话里直接按该盘符访问。';
      await refresh();
    } finally {
      setBusy(false);
    }
  }

  async function unmount(id) {
    if (!confirm('确定卸载这个挂载点吗？')) return;
    setBusy(true);
    try {
      var res = await api.unmount(id);
      if (!res.ok) toast('卸载失败：' + (res.error || '未知错误') + (res.hint ? '。' + res.hint : ''), 'err');
      else {
        if (res.ms) noteTiming('卸载', res.ms);
        toast('✓ 已卸载' + (res.ms ? '（' + fmtMs(res.ms) + '）' : ''), 'ok');
      }
      await refresh();
    } finally {
      setBusy(false);
    }
  }

  document.getElementById('btnPick').addEventListener('click', function () { void pick(); });
  document.getElementById('btnInspect').addEventListener('click', function () { void doInspect(); });
  document.getElementById('btnMount').addEventListener('click', function () { void mount(); });
  document.getElementById('btnRefresh').addEventListener('click', function () { void refresh(); });
  document.getElementById('btnSettings').addEventListener('click', function () {
    if (window.seeu && window.seeu.openLocalModelSettings) window.seeu.openLocalModelSettings();
  });

  els.mounts.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute) return;
    var openPoint = t.getAttribute('data-open');
    if (openPoint) {
      api.open(openPoint).then(function (r) { if (r && !r.ok) toast('打开失败：' + (r.error || ''), 'err'); });
      return;
    }
    var id = t.getAttribute('data-unmount');
    if (id) void unmount(id);
  });

  refresh();
})();
</script>
</body>
</html>
