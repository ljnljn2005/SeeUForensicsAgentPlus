<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
<title>SeeUForensicsAgentPlus — 启动失败</title>
<style>
  :root { color-scheme: dark; --bg:#0B1220; --surface:#111C31; --accent:#22D3EE; --text:#E2E8F0; --muted:#94A3B8; --danger:#F87171; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1000px 600px at 50% -10%, #241318 0%, var(--bg) 55%, #060B14 100%);
    color: var(--text); font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 32px; overflow: auto;
  }
  .card {
    width: min(880px, 94vw); padding: 36px 40px 30px; border-radius: 18px;
    background: linear-gradient(180deg, rgba(17,28,49,.94), rgba(11,18,32,.94));
    border: 1px solid rgba(248,113,113,.25); box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 14px rgba(248,113,113,.7); flex: none; }
  h1 { font-size: 19px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px 26px; }
  .banner { padding: 14px 16px; border-radius: 10px; background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.18); color: #FCA5A5; font-size: 14px; margin-bottom: 16px; white-space: pre-wrap; }
  pre {
    margin: 0; padding: 16px; border-radius: 10px; background: #060B14; border: 1px solid rgba(148,163,184,.14);
    color: #CBD5E1; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; line-height: 1.55;
    max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  button {
    appearance: none; border-radius: 9px; padding: 10px 18px; font-size: 13px; cursor: pointer;
    border: 1px solid rgba(148,163,184,.25); background: #16233A; color: var(--text);
  }
  button:hover { border-color: rgba(34,211,238,.45); }
  button.primary { background: linear-gradient(180deg, #0E7490, #155E75); border-color: rgba(34,211,238,.55); color: #E0F7FA; }
  .foot { margin-top: 18px; color: #64748B; font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  code { color: #7DD3FC; font-family: Consolas, monospace; }
</style>
</head>
<body>
  <main class="card">
    <div class="head"><div class="dot"></div><h1>取证运行时启动失败</h1></div>
    <p class="sub">SeeUForensicsAgentPlus 未能启动内部 dsh 运行时进程。</p>

    <div class="banner" id="message">正在读取失败原因…</div>
    <pre id="detail">（暂无诊断信息）</pre>

    <div class="actions">
      <button class="primary" id="retry">重试启动</button>
      <button id="logs">打开日志目录</button>
      <button id="workspace">打开取证工作区</button>
      <button id="quit">退出</button>
    </div>

    <div class="foot">
      <span>日志：<code id="logdir">—</code></span>
      <span>排障：确认 <code>@deepseek-ai/dsh</code> 已安装、Node ≥ 24.9、端口未被占用。</span>
    </div>
  </main>

<script>
  const $ = (id) => document.getElementById(id)
  const api = window.seeu || {}

  const render = (status) => {
    if (!status) return
    if (status.message) $('message').textContent = status.message
    if (status.detail) $('detail').textContent = status.detail
  }

  if (api.info) {
    api.info().then((info) => {
      $('logdir').textContent = info.logs || '—'
      document.title = `${info.productName} — 启动失败`
      if (info.hostLog) {
        $('detail').textContent = $('detail').textContent === '（暂无诊断信息）'
          ? `诊断日志：${info.hostLog}`
          : $('detail').textContent
      }
    }).catch(() => {})
  }
  if (api.onStatus) api.onStatus(render)

  $('retry').addEventListener('click', () => { $('message').textContent = '正在重试…'; api.retry && api.retry() })
  $('logs').addEventListener('click', () => api.openLogs && api.openLogs())
  $('workspace').addEventListener('click', () => api.openWorkspace && api.openWorkspace())
  $('quit').addEventListener('click', () => api.quit && api.quit())
</script>
</body>
</html>
