                | `search_classes_by_keyword` | `search_term`（可选 `offset`、`count` 默认 20） | 按源码关键词检索类（密码/URL/加密算法名） |
                | `search_method_by_name` | `method_name` | 跨所有类搜方法名 |
                | `get_android_manifest` | 无 | 读 AndroidManifest.xml（权限/组件/入口） |
                | `get_main_activity_class` | 无 | 读主入口 Activity 源码 |
