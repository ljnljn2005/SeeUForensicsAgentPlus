- insert:
    - id: seeu-mcp-myos
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: myos-forensics
        command: D:/Programs/MYOS/Client/tools/mcp/myos_mcp_server.exe
        args: []
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 3000
          maxDelayMs: 60000
          maxAttempts: 50
