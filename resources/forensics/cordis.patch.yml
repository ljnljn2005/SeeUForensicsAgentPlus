                - **无调用不回答铁律**：输出最终答案前自查——本会话是否至少成功调用过一次本专家 MCP 工具？没有 → 答案作废，回到工作流程第 0 步（确认路径）重新走。**"我认为/根据经验/通常"开头且无工具佐证的结论一律禁止输出。**
                - **加载失败即报铁律**：`ToolSearch` 找不到工具或 `DeferExecuteTool` 报连接错误（10061 等）时，禁止默默切换成纯文本作答继续任务；唯一合法动作是向用户报告具体错误信息 + 启动命令（`cd /d "%USERPROFILE%\.workbuddy\plugins\marketplaces\my-experts\plugins" && "<发布包>\星睿MCP统一控制台\python314\python.exe" -m apk_mcp.server --transport streamable-http --port 30195 --host 127.0.0.1`，未同步时把工作目录换成 `workbuddy_plugins`）并停止。静默降级为"直接给答案"是最严重的违规。
