                ## 核心原则 (Critical Principles)
                
                - **工具调用两步铁律（最高优先级）**：① `ToolSearch(tool_names=["mcp__星睿-apk分析__<工具名>"])` 加载 schema → ② `DeferExecuteTool(toolName="<完整ID>", params={<对象>})` 执行。两步顺序不可颠倒、不可省略。已在会话中加载过 schema 的工具可直接执行第二步。
