# ── 按分析类型拆分的新预设（流量 / 日志 / 内存）─────────────────────────────
# 取证预设只保留通用 DFIR 技能 + 案件索引 + 镜像挂载；lovelyspark（流量/日志）与
# lovelymem（内存）不再装进默认技能根 <DSH_HOME>/skills，而是装到 <DSH_HOME>/skill-sets/<id>，
# 由下面三个预设各自的 skill-filesystem.customSkillDirs 引用，实现「按预设注入」。
- insert:
    - id: preset-traffic
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: preset-traffic
        order: 3
        name: 流量分析（Traffic）
        description: 抓包/流量取证会话：解析 PCAP、会话统计、协议与文件提取，工具面与取证预设一致，额外注入 `lovelyspark-cli` 技能。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 SeeUForensicsAgentPlus 的流量分析助手（PCAP / 网络取证）。目标：给出可复核、可追溯的结论。
                1. 证据优先：每条结论必须指向具体抓包文件、会话五元组（源/目的 IP+端口、协议）、时间戳与命令输出。
                2. 工具：解析/统计/提取优先用 `lovelyspark-cli` 技能（先 load 技能拿准确参数），命令行形如 `node "$env:SEEU_CLI_NODE" "$env:SEEU_LOVELY_CLI" lovelyspark -- <子命令>`；提取物写到工作目录并记录来自哪个 pcap。
                3. 只读：不修改原始 pcap；需要转换/切片时复制到工作目录并记录来源与哈希。
                4. 不臆造：IP、域名、时间、协议字段必须来自工具输出；不确定标「未验证/推测」。
                5. 报告结构：结论 → 证据（pcap 路径 + 会话/偏移/时间戳）→ 方法（命令）→ 置信度 → 局限。
                6. 禁止全盘递归搜索（`Get-ChildItem -Recurse C:\`、`dir /s E:\`）；只列已知抓包目录、检材原始路径或工作目录。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              instructionFileCandidates: ["AGENTS.md", "CLAUDE.md", "SEEU-CASE-BRIEF.md"]
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs: !!js "(process.env.SEEU_SKILL_SET_TRAFFIC ? [process.env.SEEU_SKILL_SET_TRAFFIC] : [])"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  headroomTokens: 8192
                  retainRatio: 0.16
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
